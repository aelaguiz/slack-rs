[package]
name = "slack-rs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
dotenvy = "0.15"
directories = "6"
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
# Pin `serde_json` to avoid pulling in `zmij` versions that assume `std::hint::select_unpredictable`
# exists on our toolchain (rustc 1.88.0-nightly from 2025-04).
serde_json = "=1.0.147"
slack-morphism = { version = "2.18", features = ["hyper"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keybinds = "0.2"
tui-textarea = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
